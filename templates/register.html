<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>cadastro</title>
</head>
<body>
<header>
    <h1>Cadastro usuário</h1>
</header>
<form>
    <div class="formfield-container">
    <label for="name">Eu sou:</label>
        <div>
            <input type="radio" id="rEmployee"/>
            <label for="rEmployee">Funcionario</label>
        </div>
        <div>
            <input type="radio" id="rAdmin"/>
            <label for="rAdmin">Administrador</label>
        </div>
    </div>
    <div class="formfield-container">
    <label for="name">Nome e Último Sobrenome</label>
    <input type="text" id="name" placeholder="Joao da Silva"/>
    </div>
    <div class="formfield-container">
    <label for="cpf">CPF</label>
    <input type="number" id="cpf"/>
    </div>
    <div class="formfield-container">
    <label for="name">Data de Nascimento</label>
    <input type="date" id="birthdate"/>
    </div>
    <div class="formfield-container">
    <label for="pw1">Crie senha</label>
    <input type="password" id="pw1"/>
    </div>
    <div class="formfield-container">
    <label for="pw2">Repita senha</label>
    <input type="password" id="pw2"/>
    </div>
<button type="submit">Cadastrar</button>
</form>
</body>
</html>
